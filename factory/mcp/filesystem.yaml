name: filesystem
description: >
  Read/write access to local filesystem paths via MCP.
  Backs filesystem_read, workspace_write, and artifact_writer tool aliases.
command: cargo
args:
  - "run"
  - "--quiet"
  - "--"
  - "mcp"
  - "serve"
  - "--transport"
  - "stdio"
tool_aliases:
  - filesystem_read
  - workspace_write
  - artifact_writer
platforms:
  - linux
  - windows
  - darwin
notes: >
  Served by Harkonnen's Rust-native MCP self-server. This replaces the old
  Node.js filesystem helper for agents that must stay within MCP boundaries.
