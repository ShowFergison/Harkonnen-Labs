name: memory
description: >
  Open Brain (OB1) shared memory via MCP.
  Backs memory_store and metadata_query tool aliases for Coobie while keeping
  recall available across Claude, ChatGPT, Codex, Cursor, and Twilight-connected
  agents.
command: cargo
args:
  - "run"
  - "--quiet"
  - "--"
  - "mcp"
  - "serve"
  - "--transport"
  - "stdio"
tool_aliases:
  - memory_store
  - metadata_query
platforms:
  - linux
  - windows
  - darwin
notes: >
  Served by Harkonnen's Rust-native MCP self-server. OB1 remains the default
  long-term semantic backend when configured, but the local helper surface no
  longer requires a Node.js supergateway.
