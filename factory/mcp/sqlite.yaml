name: sqlite
description: >
  SQLite database access via MCP. Useful for Coobie querying factory/state.db
  and for Sable reading scenario result history.
command: cargo
args:
  - "run"
  - "--quiet"
  - "--"
  - "mcp"
  - "serve"
  - "--transport"
  - "stdio"
tool_aliases:
  - metadata_query
  - db_read
platforms:
  - linux
  - windows
  - darwin
notes: >
  Served by Harkonnen's Rust-native MCP self-server. Coobie should use the Rust
  db layer for writes; the MCP surface is for agent-level query access.
