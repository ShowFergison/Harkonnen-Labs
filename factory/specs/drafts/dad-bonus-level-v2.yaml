id: dad-bonus-level-v2
title: Dad Was Right - Bonus Level (build)
purpose: >
  Add one self-contained bonus room to the existing point-and-click adventure
  "DAD WAS RIGHT" (v2.0, ~9700 lines of plain JS across js/). The room is
  optional content in the established house style: three playable characters
  with distinct voices, a puzzle solved with an inventory item, and one DAD
  WAS RIGHT beat. This is additive content work against a real codebase.
  Unlike v1 this spec declares a worker_harness, so Mason authors the edits
  rather than only planning them.
scope:
  - dad-was-right-bonus-level
project_components:
  # Named file-by-file rather than as all of js/. Every code_under_test path is
  # read into the model's context, and js/ is 407 KB — roughly 100k tokens, past
  # what the local 8 GB-VRAM fallback can hold at all. These four files are the
  # entire surface this change needs: the new module, the hint ladder it appends
  # to, and one existing room to copy the shape from.
  - name: dad_was_right_bonus_module
    role: code_under_test
    kind: browser_js
    path: js/bonus.js
    owner: product_repo
    notes:
      - This file does not exist yet - create it.
      - Plain browser JS, no build step and no package manager.
      - The game runs by opening index.html directly from the filesystem.
      - Art helpers live in js/hd-*.js and draw at 640x400.
    interfaces:
      - G.rooms registry
      - G.flags run state
      - per-character verb maps for griffyn, eleanor and storm
  - name: dad_was_right_hints
    role: code_under_test
    kind: browser_js
    path: js/hints.js
    owner: product_repo
    notes:
      - The TEXT DAD hint ladder lives here - append four escalating entries.
  - name: dad_was_right_rooms
    role: code_under_test
    kind: browser_js
    path: js/data.js
    owner: product_repo
    notes:
      - Reference only - copy the shape of G.rooms.living, do not edit this file.
      - Rooms are registered as G.rooms.<id> with id, name, floor, draw and objects[].
  # index.html carries the <script src> ladder, so registering js/bonus.js requires
  # editing it. README.md is required by the outputs below. Both are named here
  # because Mason may only write paths declared as code_under_test.
  - name: dad_was_right_index
    role: code_under_test
    kind: html
    path: index.html
    owner: product_repo
    notes:
      - Append exactly one <script src="js/bonus.js"></script> tag after js/hints.js.
      - Do not reorder or remove any existing script tag.
  - name: dad_was_right_readme
    role: code_under_test
    kind: markdown
    path: README.md
    owner: product_repo
    notes:
      - Append one short section describing the bonus room and how to reach it.
constraints:
  # Sanctioned registration hook. "Reachable in game" and "do not modify the acts"
  # cannot both hold unless one entry path is blessed explicitly, so: js/bonus.js
  # may, at load time, append exactly one entrance object to exactly one existing
  # room's objects[] array. It must append, never replace or reassign the room or
  # its objects[], and the whole hook must live inside js/bonus.js so deleting that
  # file plus its script tag removes it completely. Doing this from js/bonus.js is
  # NOT a modification of the acts; editing an act's own source to add the entrance
  # IS, and remains forbidden.
  - "registration: js/bonus.js appends one entrance object to one existing room's objects[] at load time"
  - additive only - do not modify the three acts, the engine, or the save format
  - plain browser JS in the existing style, no build step, no bundler
  - no third-party libraries or frameworks - the game runs by opening index.html
  - follow the existing room shape - G.rooms.<id> with id, name, floor, draw and objects[]
  - each object uses the existing verb shape - a string, a per-character map, or a function
  - all three characters must have distinct written responses, matching their established voices
  - Storm's verbs are Sniff, Fetch and Dig, not the human verb set
inputs:
  - "project: the dad-was-right-game repository"
  - "room reference: js/data.js G.rooms.living for the canonical room and object shape"
  - "art reference: js/hd-house.js for how a room is drawn at 640x400"
  - "hint reference: js/hints.js for the TEXT DAD hint ladder"
outputs:
  - "a new room module at js/bonus.js defining exactly one bonus room"
  - the room registered so it is reachable in game, via the sanctioned entrance hook in the constraints
  - hint ladder entries for the new puzzle in the established four-step shape
  - a short section in README.md describing the bonus room and how to reach it
acceptance_criteria:
  - "The new room module is written to js/bonus.js and loaded from index.html"
  - "A new room is defined as G.rooms.<id> with id, name, floor, draw and objects"
  - The room contains at least four interactive objects, each with a rect and usePos
  - Every object answers lookat for griffyn, eleanor and storm with different text
  - At least one object responds to Storm's sniff, fetch or dig verbs
  - The room contains one puzzle that requires an inventory item to solve
  - Solving the puzzle sets a flag on G.flags and triggers one DAD WAS RIGHT beat
  - The hint ladder gains four escalating entries for the puzzle, ending with a direct answer
  - Every new and modified .js file parses without syntax errors
  - No file outside js/, index.html and README.md is modified
forbidden_behaviors:
  - modifying the existing three acts or their rooms
  - changing the save format in js/save.js
  - introducing a build step, package manager or third-party dependency
  - deleting or rewriting existing art, music or engine code
  - reaching outside the project directory
rollback_requirements:
  - the bonus room must be removable by deleting its module and its registration line
  - existing save files must continue to load unchanged
dependencies: []
performance_expectations:
  - the room must draw at the same 640x400 resolution as the existing rooms
  - no perceptible load delay when entering the room
security_expectations:
  - no network calls - the game runs entirely offline from the filesystem
  - secrets must not appear in logs or artifact bundles
worker_harness:
  adapter: retriever_forge_adapter
  profile: trail_pack_forge
  allowed_components:
    - dad_was_right_game
  denied_paths:
    - factory/scenarios/hidden
    - factory/memory
    - .harkonnen
    - js/save.js
    - js/engine.js
  visible_success_conditions:
    - every new and modified .js file parses under node --check
    - worker returns changed files and a rationale summary
    - no file outside js/, index.html and README.md is modified
  return_artifacts:
    - changed_files
    - execution_log
    - rationale_summary
  max_iterations: 4
  continuity_file: bonus-level-state.json
  # Opt in to Mason-authored file writes inside the staged workspace.
  llm_edits: true
  # Commit Mason's edits to mason/<spec-id>-<run-id> so a real diff exists.
  git_branch: true
test_commands:
  - node --check js/bonus.js
